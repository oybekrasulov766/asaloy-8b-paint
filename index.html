<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Paint App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        /* Панель инструментов */
        .toolbar {
            height: 60px;
            background-color: #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #444;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background: #666;
        }

        button.active {
            background: #007bff;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            background: none;
        }

        .canvas-container {
            flex-grow: 1;
            position: relative;
        }

        canvas {
            display: block;
            background-color: white;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button id="brush" class="active">Кисть</button>
        <button id="eraser">Ластик</button>
        <button id="line">Линия</button>
        <button id="rect">Квадрат</button>
        <button id="circle">Круг</button>
        
        <div style="width: 2px; height: 30px; background: #555;"></div>
        
        <input type="color" id="colorPicker" value="#000000">
        <input type="range" id="brushSize" min="1" max="50" value="5">
        
        <div style="width: 2px; height: 30px; background: #555;"></div>
        
        <button id="undo">Назад</button>
        <button id="redo">Вперед</button>
        <button id="clear" style="background: #dc3545;">Очистить</button>
        <button id="save" style="background: #28a745;">Сохранить</button>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const colorPicker = document.getElementById("colorPicker");
        const brushSize = document.getElementById("brushSize");
        const buttons = document.querySelectorAll('.toolbar button');

        let tool = "brush";
        let painting = false;
        let startX, startY;
        let snapshot; // Для предпросмотра фигур

        let history = [];
        let redoStack = [];

        // ---------- ИНИЦИАЛИЗАЦИЯ И РАЗМЕР ----------
        function resizeCanvas() {
            // Сохраняем текущее содержимое перед изменением размера
            const tempImage = canvas.toDataURL();
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 60;
            
            const img = new Image();
            img.src = tempImage;
            img.onload = () => ctx.drawImage(img, 0, 0);
            
            // Настройки кисти слетают при ресайзе, ставим их заново
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // ---------- ФУНКЦИИ СОСТОЯНИЯ ----------
        function saveState() {
            history.push(canvas.toDataURL());
            if (history.length > 30) history.shift();
            redoStack = [];
        }

        function restoreState(data) {
            const img = new Image();
            img.src = data;
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
        }

        // Сохраняем пустое состояние в начале
        saveState();

        // ---------- ВЫБОР ИНСТРУМЕНТОВ ----------
        document.querySelectorAll('[id]').forEach(el => {
            if(['brush', 'eraser', 'line', 'rect', 'circle'].includes(el.id)) {
                el.onclick = () => {
                    tool = el.id;
                    buttons.forEach(btn => btn.classList.remove('active'));
                    el.classList.add('active');
                };
            }
        });

        // ---------- ЛОГИКА РИСОВАНИЯ ----------
        canvas.addEventListener("mousedown", (e) => {
            painting = true;
            startX = e.offsetX;
            startY = e.offsetY;

            // Делаем снимок текущего холста для предпросмотра фигур
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.lineWidth = brushSize.value;
            ctx.strokeStyle = (tool === "eraser") ? "#ffffff" : colorPicker.value;
            ctx.fillStyle = colorPicker.value;
            
            if (tool === "brush") {
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX, startY);
                ctx.stroke();
            }
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!painting) return;

            const x = e.offsetX;
            const y = e.offsetY;

            if (tool === "brush" || tool === "eraser") {
                ctx.lineTo(x, y);
                ctx.stroke();
            } else {
                // Восстанавливаем состояние из снимка, чтобы фигура не «тянулась»
                ctx.putImageData(snapshot, 0, 0);
                
                ctx.beginPath();
                if (tool === "line") {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(x, y);
                } else if (tool === "rect") {
                    ctx.strokeRect(startX, startY, x - startX, y - startY);
                } else if (tool === "circle") {
                    const r = Math.hypot(x - startX, y - startY);
                    ctx.arc(startX, startY, r, 0, Math.PI * 2);
                }
                ctx.stroke();
            }
        });

        canvas.addEventListener("mouseup", () => {
            if (!painting) return;
            painting = false;
            saveState(); // Сохраняем в историю ПОСЛЕ завершения мазка или фигуры
        });

        // ---------- КНОПКИ УПРАВЛЕНИЯ ----------
        document.getElementById("undo").onclick = () => {
            if (history.length <= 1) return;
            redoStack.push(history.pop());
            restoreState(history[history.length - 1]);
        };

        document.getElementById("redo").onclick = () => {
            if (!redoStack.length) return;
            const state = redoStack.pop();
            history.push(state);
            restoreState(state);
        };

        document.getElementById("clear").onclick = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveState();
        };

        document.getElementById("save").onclick = () => {
            const a = document.createElement("a");
            a.download = "my-drawing.png";
            a.href = canvas.toDataURL();
            a.click();
        };
    </script>
</body>
</html>
